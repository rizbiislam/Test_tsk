name: AeroTech CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Action'
        required: true
        default: 'apk-build'
        type: choice
        options:
          - 'apk-build'
          - 'ota-update'

jobs:
  build:
    name: AeroTech Cloud Automation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📱 Execute Action
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "ota-update" ]; then
            echo "Publishing Over-The-Air (OTA) update (uses 0 EAS builds)..."
            eas update --branch preview --auto --non-interactive
          else
            echo "Starting cloud APK build..."
            eas build --platform android --profile preview --non-interactive --no-wait
          fi
